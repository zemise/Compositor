name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    name: Universal DMG
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Verify tag matches the app version
        run: |
          version=$(xcodebuild -project Compositor.xcodeproj -scheme Compositor -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Universal 2 app
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-

      - name: Verify and package DMG
        run: |
          set -euo pipefail
          app='DerivedData/Build/Products/Release/Compositor.app'
          executable="$app/Contents/MacOS/Compositor"
          test -d "$app"
          lipo -verify_arch arm64 x86_64 "$executable"
          codesign --verify --deep --strict --verbose=2 "$app"

          mkdir -p dist stage
          ditto "$app" stage/Compositor.app
          ln -s /Applications stage/Applications
          hdiutil create -volname Compositor -srcfolder stage -ov -format UDZO "dist/Compositor.dmg"
          (cd dist && shasum -a 256 Compositor.dmg > SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Compositor.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Compositor $VERSION" \
            --generate-notes \
            --notes "Universal 2 installer for Apple silicon and Intel Macs. This community build is ad-hoc signed and is not Apple-notarized; on first launch, use Control-click → Open if macOS blocks it."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-${{ env.VERSION }}
          path: |
            dist/Compositor.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
