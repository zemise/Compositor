name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    name: Universal DMG
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Verify tag matches the app version
        run: |
          version=$(xcodebuild -project Compositor.xcodeproj -scheme Compositor -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build Universal 2 app
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-

      - name: Verify app architectures
        run: |
          set -euo pipefail
          app='DerivedData/Build/Products/Release/Compositor.app'
          executable="$app/Contents/MacOS/Compositor"
          test -d "$app"
          lipo "$executable" -verify_arch arm64 x86_64
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            echo '::warning::The runner cannot validate the temporary signature of every Sparkle component.'
          fi

      - name: Package installers
        run: |
          set -euo pipefail
          app='DerivedData/Build/Products/Release/Compositor.app'
          mkdir -p dist stage
          ditto -c -k --keepParent "$app" dist/Compositor.zip
          ditto "$app" stage/Compositor.app
          ln -s /Applications stage/Applications
          if ! hdiutil create -quiet -fs HFS+ -volname Compositor -srcfolder stage -ov -format UDZO dist/Compositor.dmg; then
            echo '::warning::DMG creation is unavailable on this runner; publishing the ZIP installer instead.'
          fi
          (cd dist && shasum -a 256 Compositor.zip > SHA256SUMS.txt)
          if [[ -f dist/Compositor.dmg ]]; then
            (cd dist && shasum -a 256 Compositor.dmg >> SHA256SUMS.txt)
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Compositor.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Compositor $VERSION" \
            --generate-notes \
            --notes "Universal 2 installer for Apple silicon and Intel Macs. This community build is ad-hoc signed and is not Apple-notarized; on first launch, use Control-click → Open if macOS blocks it."
          if [[ -f dist/Compositor.dmg ]]; then
            gh release upload "$GITHUB_REF_NAME" dist/Compositor.dmg --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-${{ env.VERSION }}
          path: |
            dist/Compositor.dmg
            dist/Compositor.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
